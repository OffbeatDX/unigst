name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2026.11.21.1; leave blank to auto-increment today)'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Resolve tag
        id: tag
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $tag = $env:INPUT_TAG.Trim()
            if ([string]::IsNullOrEmpty($tag)) {
              $today = (Get-Date).ToUniversalTime().ToString('yyyy.MM.dd')
              $existing = git tag -l "v$today" "v$today.*"
              $max = 0
              foreach ($t in $existing) {
                if ($t -eq "v$today") {
                  if ($max -lt 1) { $max = 1 }
                } elseif ($t -match "^v$([regex]::Escape($today))\.(\d+)$") {
                  $n = [int]$Matches[1]
                  if ($n -gt $max) { $max = $n }
                }
              }
              $tag = "v$today.$($max + 1)"
            }
          } else {
            $tag = $env:REF_NAME
          }

          if ($tag -notmatch '^v\d{4}\.\d{1,2}\.\d{1,2}(\.\d+)?$') {
            throw "release tag '$tag' must match vYYYY.MM.DD or vYYYY.MM.DD.N"
          }

          $version = $tag.Substring(1)
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: cargo test --all-targets --locked

      - name: Build
        env:
          UNIGST_VERSION: ${{ steps.tag.outputs.version }}
        run: cargo build --release --locked

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $assets = @('target\release\unigst.exe', 'target\release\unigstgui.exe')
          foreach ($path in $assets) {
            if (-not (Test-Path $path)) { throw "build produced no $path" }
          }

          $sums = 'target\release\SHA256SUMS.txt'
          $assets | ForEach-Object {
            $h = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $(Split-Path $_ -Leaf)"
          } | Set-Content -Path $sums -Encoding utf8NoBOM

          $ghArgs = @('release', 'create', $env:TAG) + $assets + @($sums, '--title', $env:TAG, '--generate-notes')
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $ghArgs += @('--target', $env:GITHUB_SHA)
          }
          & gh @ghArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
