name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Resolve tag
        id: tag
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_TAG } else { $env:REF_NAME }
          if ([string]::IsNullOrWhiteSpace($tag)) { throw 'release tag must not be empty' }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Test
        run: cargo test --all-targets --locked

      - name: Build
        run: cargo build --release --locked

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          foreach ($exe in 'unigst.exe', 'unigstgui.exe') {
            if (-not (Test-Path "target\release\$exe")) { throw "build produced no $exe" }
          }
          gh release create $env:TAG target\release\unigst.exe target\release\unigstgui.exe --title $env:TAG --generate-notes
